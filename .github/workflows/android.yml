name: Android APK

# Builds one installable APK and publishes it as a GitHub Release ("latest-apk").
# Run it manually from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web app (points the app at the Render server)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://afit-wayfinder-1.onrender.com' }}
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log || {
            echo "::error title=Gradle failed::$(grep -E -A6 'What went wrong|FAILURE' gradle.log | head -c 3000 | tr '\n' '|')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: afit-wayfinder-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk afit-wayfinder.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk afit-wayfinder.apk --title "AFIT Wayfinder APK (latest)" --notes "Download afit-wayfinder.apk on your Android phone and install it (allow installs from this source when asked)."
